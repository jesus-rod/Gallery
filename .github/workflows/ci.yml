name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test package
        working-directory: Gallery
        run: swift test
      - name: UI tests on fixtures
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; print(next(d['udid'] for runtime in devices.values() for d in runtime if d['name'].startswith('iPhone')))")
          xcodebuild test -scheme GalleryApp -destination "id=$DEVICE_ID"
